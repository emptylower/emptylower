# GitHub Profile Metrics — Sakura Night Theme
#
# Design notes:
# - Each metric is its own job so a single failure never blocks the others.
# - plugins_errors_fatal: yes ensures a broken render never overwrites a good SVG.
# - plugin_lines lives in its own job: it is slow (~15 min) and crashes on repos
#   whose contributor stats include deleted accounts, so it must not take `base` down.
# - No third-party Vercel badge services: they hit spending limits (HTTP 402) and
#   render as broken images. Everything below is generated here and committed.

name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:

  base:
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: write }
    timeout-minutes: 20
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/base.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: emptylower
          template: classic
          config_timezone: Asia/Shanghai
          base: "header, activity, community, repositories"
          plugin_traffic: yes
          plugin_introduction: yes
          plugins_errors_fatal: yes

  lines:
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: write }
    timeout-minutes: 30
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/lines.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_lines: yes
          plugin_lines_sections: repositories, history
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 1
          plugin_lines_delay: 30
          plugins_errors_fatal: yes

  isocalendar:
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: write }
    timeout-minutes: 20
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: yes

  languages:
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: write }
    timeout-minutes: 45
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/languages.indepth.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, scss, tex, less, dockerfile, makefile, qmake, lex, cmake,
            shell, gnuplot, markdown, mdx, json, yaml, batchfile, powershell
          plugin_languages_indepth: yes
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_threshold: 1%
          plugin_languages_limit: 6
          plugin_languages_analysis_timeout: 30
          plugin_languages_analysis_timeout_repositories: 7.5
          plugins_errors_fatal: yes

  stargazers:
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: write }
    timeout-minutes: 20
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/stargazers.chartist.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_charts_type: chartist
          plugins_errors_fatal: yes

  stars:
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: write }
    timeout-minutes: 20
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/stars.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 6
          plugins_errors_fatal: yes

  followup:
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: write }
    timeout-minutes: 20
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/followup.indepth.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_followup: yes
          plugin_followup_indepth: yes
          plugins_errors_fatal: yes

  reactions:
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: write }
    timeout-minutes: 20
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/reactions.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_details: percentage
          plugins_errors_fatal: yes

  calendar:
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: write }
    timeout-minutes: 20
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/calendar.full.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 2
          plugins_errors_fatal: yes

  achievements:
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: write }
    timeout-minutes: 20
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugins_errors_fatal: yes

  habits:
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: write }
    timeout-minutes: 20
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugins_errors_fatal: yes
